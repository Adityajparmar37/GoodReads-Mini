# Load balancing — add more `server` lines here to scale the backend horizontally
upstream backend {
    server goodreads-backend:5000;
}

# Gzip compression
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

# Response caching
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=backend_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Firewall: rate limiting — 10 req/sec general, 5 req/min for auth endpoints
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;

server {
    listen 80;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";

    # Block common file probes
    location ~* \.(env|git|sql|bak)$ { return 404; }

    # Render health check
    location = /health {
        access_log off;
        return 200 "ok";
    }

    # Auth — strict rate limit, never cached
    location ~* ^/api/v1/auth/(login|register) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host      $host;
    }

    # WebSocket (Socket.IO) — never cached
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Everything else — cached GETs, rate limited
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_cache        backend_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid  200 5m;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache     $http_authorization;
        add_header         X-Cache-Status $upstream_cache_status;

        proxy_pass http://backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host      $host;
    }
}
