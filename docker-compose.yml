services:
  goodreads-backend:
    image: adijparmar119/goodreads-mini-backend:v3.0
    build:
      context: ./Backend
      dockerfile: dockerfile
    env_file:
      - ./Backend/.env
    environment:
      - PORT=3000
      - APP_NAME=goodreads-backend
    volumes:
      - ./Backend:/app
      - /app/node_modules
    expose:
      - "3000"
    ports:
      - "3000:3000"

  goodreads-backend-2:
    image: adijparmar119/goodreads-mini-backend:v3.0
    build:
      context: ./Backend
      dockerfile: dockerfile
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5050
      - APP_NAME=goodreads-backend-2
    volumes:
      - ./Backend:/app
      - /app/node_modules
    expose:
      - "5050"
    ports:
      - "5050:5050"

  nginx:
    image: adijparmar119/goodreads-mini-nginx:v3.0
    build:
      context: ./Backend/nginx
    volumes:
      - ./Backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - goodreads-backend
