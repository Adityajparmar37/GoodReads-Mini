services:
  goodreads-backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
    volumes:
      - ./Backend:/app
      - /app/node_modules
    expose:
      - "5000"

  nginx:
    build:
      context: ./Backend/nginx
    volumes:
      - ./Backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - goodreads-backend
